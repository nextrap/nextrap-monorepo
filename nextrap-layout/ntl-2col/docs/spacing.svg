<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc"><title id="title">Zwei-Spalten-Abstände</title><desc id="desc">Desktop und Mobile mit Main-Inset und randlosem Aside. Gap bleibt zwischen den Regionen.</desc><style>text{font-family:Arial,sans-serif} .label{font-weight:700}</style><rect width="1040" height="560" fill="#f6f8fb" /><text x="40" y="44" font-size="28" fill="#24344a">NTL-2COL · Außenkante und innere Kante</text><text x="40" y="76" font-size="16" fill="#24344a">P = äußerer Inset · G = Gap · Beispiel: randloses Aside</text><text x="40" y="116" font-size="20" fill="#24344a">Desktop</text><rect x="40" y="140" width="604" height="212" rx="18" fill="#dbeafe" stroke="#24344a" stroke-width="2" /><rect x="66" y="166" width="276" height="160" rx="0" fill="white" stroke="none" stroke-width="2" /><rect x="342" y="166" width="16" height="160" rx="0" fill="#fde6ac" stroke="none" stroke-width="2" /><rect x="358" y="142" width="284" height="208" rx="0" fill="#9dd9cb" stroke="none" stroke-width="2" clip-path="url(#frame-0)" /><text x="162" y="250" font-size="16" fill="#24344a">Main</text><text x="457" y="250" font-size="16" fill="#24344a">Aside</text><text x="48" y="253" font-size="13" fill="#24344a">P</text><text x="347" y="250" font-size="12" fill="#24344a">G</text><text x="198" y="160" font-size="13" fill="#24344a">P</text><text x="198" y="345" font-size="13" fill="#24344a">P</text><text x="40" y="386" font-size="16" fill="#24344a">Innere Spaltenkanten: immer 0 → dazwischen nur G</text><text x="40" y="414" font-size="16" fill="#24344a">Reverse: Außenkanten tauschen mit der Anordnung</text><text x="720" y="116" font-size="20" fill="#24344a">Mobil · Aside zuerst</text><rect x="720" y="140" width="264" height="244" rx="18" fill="#dbeafe" stroke="#24344a" stroke-width="2" /><rect x="722" y="142" width="260" height="90" rx="0" fill="#9dd9cb" stroke="none" stroke-width="2" clip-path="url(#frame-1)" /><rect x="746" y="232" width="212" height="16" rx="0" fill="#fde6ac" stroke="none" stroke-width="2" /><rect x="746" y="248" width="212" height="110" rx="0" fill="white" stroke="none" stroke-width="2" /><text x="816" y="192" font-size="16" fill="#24344a">Aside</text><text x="812" y="308" font-size="16" fill="#24344a">Main</text><text x="724" y="308" font-size="13" fill="#24344a">P</text><text x="834" y="379" font-size="13" fill="#24344a">P</text><text x="835" y="245" font-size="12" fill="#24344a">G</text><rect x="42" y="445" width="20" height="20" rx="0" fill="#dbeafe" stroke="none" stroke-width="2" /><text x="72" y="461" font-size="16" fill="#24344a">P: außen positiv oder 0</text><rect x="355" y="445" width="20" height="20" rx="0" fill="#fde6ac" stroke="none" stroke-width="2" /><text x="385" y="461" font-size="16" fill="#24344a">G: kein Zusatz-Inset</text><text x="40" y="505" font-size="15" fill="#24344a">Große Abstände: P oder G erhöhen. Sonderabstände: with-region-inset(region, Wert, Kanten).</text><text x="40" y="533" font-size="15" fill="#24344a">Randloses Aside: with-aside-bleed(). Der Wrapper behält die gemeinsame gerundete Außenkontur.</text><defs><clipPath id="frame-0"><rect x="42" y="142" width="600" height="208" rx="16" /></clipPath><clipPath id="frame-1"><rect x="722" y="142" width="260" height="240" rx="16" /></clipPath></defs></svg>