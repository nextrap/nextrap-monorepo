<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nte-consent-blocker Demos</title>
  </head>
  <body>
    <!-- Gemeinsame inerte Vorlagen stehen vor dem Viewer und bleiben bei Demo-Wechseln erhalten. -->
    <template id="google-maps-template">
      <iframe
        title="Eiffelturm auf Google Maps"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2624.999441644419!2d2.292292615674698!3d48.85837307928795!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47e66efcbd9b8b9%3A0x421a5e7c8a9b8c0!2sEiffel%20Tower%20(La%20Tour%20Eiffel)!5e0!3m2!1sen!2sfr!4v1616581234567"
      ></iframe>
    </template>
    <template id="google-maps-background">
      <img
        loading="lazy"
        fetchpriority="low"
        alt="Eiffelturm – Karte noch nicht geladen"
        src="https://cdn.leuffen.de/hyperpage-components/v1.0/google-maps/maps-preview.jpg"
      />
    </template>
    <template id="google-maps-pre-consent">
      <button class="btn btn-primary" data-action="consent">Karte laden</button>
      <p>Mit Klick auf Karte laden werden externe Google-Maps-Inhalte geladen.</p>
    </template>

    <!-- Registriert nur vorhandene Markdown-Demos und die aktuelle Dokumentation. -->
    <nte-demo-viewer welcome-title="nte-consent-blocker" readme="/README.md">
      <demo title="Allgemeine Demo" description="Grundlegende Funktionalität" src="/demo/base.md"></demo>
      <demo
        title="Pairing ntl-2col"
        description="Consent Blocker als Aside und Top in ntl-2col"
        src="/demo/pairing-ntl-2col.md"
      ></demo>
    </nte-demo-viewer>

    <!-- Lädt den tatsächlichen TypeScript-Einstieg für Vite und das Demo-Theme. -->
    <script src="/demo/main.ts" type="module"></script>
  </body>
</html>
