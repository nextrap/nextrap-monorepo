<main class="nte-input-demo">
  <h1>nte-input</h1>
  <p>Komplettes Kontaktformular mit <code>TJForm</code> und zentralem <code>nte-feedback</code>.</p>

  <section>
    <h2>TJForm Beispiel</h2>
    <p>
      Beim Absenden wertet <code>TJForm</code> alle benannten <code>nte-input</code>-Elemente als Objekt aus.
    </p>

    <nte-feedback></nte-feedback>

    <tj-form preset="nte-input-form-demo">
      <ntl-2col class="style-default">
        <div slot="main">
          <nte-input
            class="style-default hoverlabel"
            label="Name"
            type="text"
            name="name"
            required
          ></nte-input>

          <nte-input
            class="style-default hoverlabel"
            label="Telefon"
            type="text"
            inputmode="tel"
            name="telefon"
          ></nte-input>

          <nte-input
            class="style-default hoverlabel"
            label="E-Mail"
            type="email"
            name="email"
            required
          ></nte-input>
        </div>

        <div slot="aside">
          <nte-input
            class="style-default hoverlabel"
            label="Nachricht"
            type="textarea"
            name="nachricht"
            required
          ></nte-input>

          <nte-input
            class="style-default"
            label="Ich akzeptiere die Datenschutzerklärung"
            type="checkbox"
            name="datenschutz"
            value="accepted"
            required
          ></nte-input>

          <div class="demo-actions">
            <button class="btn btn-primary" type="submit">Absenden</button>
          </div>
        </div>
      </ntl-2col>
    </tj-form>
  </section>
</main>
