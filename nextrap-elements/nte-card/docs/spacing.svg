<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" role="img" aria-labelledby="title desc"><title id="title">Card-Abstände</title><desc id="desc">Drei Cards zeigen normale Insets, randloses Image mit Content und Image-only.</desc><style>text{font-family:Arial,sans-serif} .label{font-weight:700}</style><rect width="1040" height="540" fill="#f6f8fb" /><text x="40" y="44" font-size="28" fill="#24344a">NTE-Card · Abstände direkt vergeben</text><text x="40" y="76" font-size="16" fill="#24344a">P = äußerer Inset · G = Gap zwischen Regionen · schematische Darstellung</text><text x="40" y="116" font-size="20" fill="#24344a">Normal</text><rect x="40" y="140" width="264" height="244" rx="18" fill="white" stroke="#24344a" stroke-width="2" /><rect x="42" y="142" width="260" height="240" rx="16" fill="#dbeafe" stroke="none" stroke-width="2" /><rect x="66" y="166" width="212" height="90" rx="0" fill="#9dd9cb" stroke="none" stroke-width="2" clip-path="url(#frame-0)" /><rect x="66" y="272" width="212" height="86" rx="0" fill="white" stroke="none" stroke-width="2" /><rect x="66" y="256" width="212" height="16" rx="0" fill="#fde6ac" stroke="none" stroke-width="2" /><text x="78" y="219" font-size="16" fill="#24344a">Image</text><text x="78" y="316" font-size="16" fill="#24344a">Content</text><text x="314" y="269" font-size="16" fill="#24344a">G</text><text x="150" y="376" font-size="14" fill="#24344a">P</text><text x="40" y="416" font-size="16" fill="#24344a">Seiten / oben: P</text><text x="40" y="440" font-size="16" fill="#24344a">Content: seitlich / unten P</text><text x="370" y="116" font-size="20" fill="#24344a">Randloses Image</text><rect x="370" y="140" width="264" height="220" rx="18" fill="white" stroke="#24344a" stroke-width="2" /><rect x="372" y="142" width="260" height="216" rx="16" fill="#dbeafe" stroke="none" stroke-width="2" /><rect x="372" y="142" width="260" height="90" rx="0" fill="#9dd9cb" stroke="none" stroke-width="2" clip-path="url(#frame-1)" /><rect x="396" y="248" width="212" height="86" rx="0" fill="white" stroke="none" stroke-width="2" /><rect x="396" y="232" width="212" height="16" rx="0" fill="#fde6ac" stroke="none" stroke-width="2" /><text x="408" y="195" font-size="16" fill="#24344a">Image</text><text x="408" y="292" font-size="16" fill="#24344a">Content</text><text x="644" y="245" font-size="16" fill="#24344a">G</text><text x="480" y="352" font-size="14" fill="#24344a">P</text><text x="370" y="392" font-size="16" fill="#24344a">Seiten / oben: 0</text><text x="370" y="416" font-size="16" fill="#24344a">Content: seitlich / unten P</text><text x="700" y="116" font-size="20" fill="#24344a">Nur randloses Image</text><rect x="700" y="140" width="264" height="94" rx="18" fill="#9dd9cb" stroke="#24344a" stroke-width="2" /><text x="752" y="192" font-size="16" fill="#24344a">Image: alle Kanten 0</text><text x="700" y="274" font-size="16" fill="#24344a">Kein Content → kein Gap</text><text x="700" y="302" font-size="16" fill="#24344a">Kein Inset → kein Restabstand</text><rect x="42" y="460" width="20" height="20" rx="0" fill="#dbeafe" stroke="none" stroke-width="2" /><text x="72" y="476" font-size="16" fill="#24344a">P: nur an Außenkanten</text><rect x="355" y="460" width="20" height="20" rx="0" fill="#fde6ac" stroke="none" stroke-width="2" /><text x="385" y="476" font-size="16" fill="#24344a">G: bleibt unabhängig</text><rect x="690" y="460" width="20" height="20" rx="0" fill="#9dd9cb" stroke="none" stroke-width="2" /><text x="720" y="476" font-size="16" fill="#24344a">Medienfläche</text><text x="40" y="514" font-size="15" fill="#24344a">Wrapper: Rahmen + Radius + Clipping + Gap. Positive Margins auf Regionen; kein Wrapper-Padding.</text><defs><clipPath id="frame-0"><rect x="42" y="142" width="260" height="240" rx="16" /></clipPath><clipPath id="frame-1"><rect x="372" y="142" width="260" height="216" rx="16" /></clipPath></defs></svg>