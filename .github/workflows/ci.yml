name: CI
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Needed for nx-set-shas when run on the main branch
permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
      - name: Refresh workspace lockfile metadata
        # Required while npm workspaces are used; otherwise package-lock.json may not contain the correct workspace package versions for npm ci.
        run: npm update
      - run: npm ci
      - uses: nrwl/nx-set-shas@v4
      - run: npx nx affected -t test build

      # Unstyled must remain CSS-free even through dependencies; build all entry pairs for this contract check.
      - name: Build styled and unstyled package entries
        run: npx nx run-many -t build --projects='nte-*,ntl-*,style-*,nt-core'
      - name: Verify unstyled runtime and generator contract
        run: node tools/check-unstyled.mjs
