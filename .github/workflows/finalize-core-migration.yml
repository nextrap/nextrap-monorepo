name: Finalize core migration

on:
  push:
    branches:
      - refactor/unify-core-layout-styles

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy core imports and references
        shell: bash
        run: |
          set -euo pipefail
          grep -RIl --exclude-dir=.git --exclude='package-lock.json' '@nextrap/nte-core' . | while read -r file; do
            sed -i 's#@nextrap/nte-core#@nextrap/nt-core#g' "$file"
          done
          grep -RIl --exclude-dir=.git --exclude='package-lock.json' '@nextrap/ntl-core' . | while read -r file; do
            sed -i 's#@nextrap/ntl-core#@nextrap/nt-core#g' "$file"
          done

          node <<'NODE'
          const fs = require('fs');
          for (const path of [
            'nextrap-elements/nte-burger/package.json',
            'nextrap-elements/nte-demo-viewer/package.json',
          ]) {
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.dependencies ??= {};
            pkg.dependencies['@nextrap/nt-core'] = '^2.0.0';
            pkg.dependencies = Object.fromEntries(Object.entries(pkg.dependencies).sort(([a], [b]) => a.localeCompare(b)));
            fs.writeFileSync(path, JSON.stringify(pkg, null, 4) + '\n');
          }
          NODE

          rm .github/workflows/finalize-core-migration.yml

          if grep -RIn --exclude-dir=.git --exclude='package-lock.json' -E '@nextrap/(nte-core|ntl-core)' .; then
            echo 'Legacy core references remain' >&2
            exit 1
          fi

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'refactor: remove legacy core references'
          git push origin HEAD:refactor/unify-core-layout-styles
