# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Refresh workspace lockfile metadata
        # Required while npm workspaces are used; otherwise package-lock.json may not contain the correct workspace package versions for npm ci.
        run: npm update
      - name: Install dependencies
        run: npm ci
      - name: Build demo viewer
        run: npx vite build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - name: Wait for Pages artifact metadata
        # The upload can finish before the artifact becomes visible in the Actions API.
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          sleep 10
          for attempt in {1..20}; do
            if count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name=github-pages --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length'); then
              if [[ "$count" == 1 ]]; then
                echo "Pages artifact is available."
                exit 0
              elif [[ "$count" != 0 ]]; then
                echo "::error::Expected one Pages artifact, found $count."
                exit 1
              fi
            fi
            echo "Pages artifact not available (attempt $attempt/20)."
            if (( attempt < 20 )); then sleep 3; fi
          done
          echo "::error::Pages artifact did not become available."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
